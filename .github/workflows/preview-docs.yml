# TODO: temporary feature, to be able to share live version of docs from PR before merging to main
# TODO: remove when ready to merge

name: Docs PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - docs-reorganise

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  cache-pixi-lock:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
      - uses: Parcels-code/pixi-lock/create-and-cache@38495788b79a5ff26009aecc15daa9a8310b8832 # v0.1.0
        id: pixi-lock
        with:
          pixi-version: v0.70.2

  build-and-deploy-docs:
    name: "Build and Deploy Docs Preview"
    runs-on: ubuntu-latest
    needs: cache-pixi-lock
    permissions:
      contents: write # needed for gh-pages branch update
      pull-requests: write # needed for posting the URL comment on PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Pixi Lock
        uses: Parcels-code/pixi-lock/restore@38495788b79a5ff26009aecc15daa9a8310b8832 # v0.1.0
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}

      - name: Build Sphinx Documentation
        run: pixi run docs

      - name: Deploy PR Preview to GitHub Pages
        uses: rossjrw/pr-preview-action@1821033bc68ef26be4326f6345ec46a51d8db026 # v1.6.0
        with:
          source-dir: docs/_build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
